<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Engineering Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .notes-list {
            list-style: none;
            padding: 0;
        }
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            margin-bottom: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .note-item:hover {
            transform: scale(1.02);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .view-button {
            background-color: #007bff;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .view-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Computer Engineering Notes</h1>
    <input type="text" class="search-box" placeholder="Search notes..." onkeyup="filterNotes()">
    <ul class="notes-list" id="notesList">
        <li class="note-item" data-subject="Data Structures">
            <span>coming soon</span>
            <a href="#" class="view-button">View Notes</a>
        </li>
        <li class="note-item" data-subject="Operating Systems">
            <span>coming soon</span>
            <a href="#" class="view-button">View Notes</a>
        </li>
        <li class="note-item" data-subject="Database Management">
            <span>coming soon</span>
            <a href="#" class="view-button">View Notes</a>
        </li>
        <li class="note-item" data-subject="Computer Networks">
            <span>coming soon</span>
            <a href="#" class="view-button">View Notes</a>
        </li>
        <li class="note-item" data-subject="Software Engineering">
            <span>HTML HANDBOOK</span>
            <a href="Ultimate HTML handbook.pdf" class="view-button">View Notes</a>
        </li>
    </ul>
    <script>
        function filterNotes() {
            let input = document.querySelector('.search-box').value.toLowerCase();
            let notes = document.querySelectorAll('.note-item');
            
            notes.forEach(note => {
                let subject = note.getAttribute('data-subject').toLowerCase();
                note.style.display = subject.includes(input) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
